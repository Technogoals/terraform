global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: grafana
    metrics_path: /grafana/metrics
    static_configs:
      - targets:
          - grafana:3000
