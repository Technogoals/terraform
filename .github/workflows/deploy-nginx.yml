name: Deploy monitoring containers

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - nginx/**
      - .github/scripts/deploy-nginx.sh
      - .github/workflows/deploy-nginx.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: monitoring-azure-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-production
    env:
      AZURE_CLIENT_ID: c81c9b39-80e2-4a59-ad14-06d824499230
      AZURE_TENANT_ID: 8b9be59e-0342-4505-8432-2777ffdee5f4
      AZURE_SUBSCRIPTION_ID: cde0b09e-60fb-40de-85fa-f9af8b6dd549
      AZURE_RESOURCE_GROUP: rg-terraform-vm
      AZURE_VM_NAME: vm-terraform-linux
      AZURE_CORE_OUTPUT: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Package monitoring configuration
        shell: bash
        run: |
          archive="$(tar -czf - -C nginx compose.yaml conf.d grafana html prometheus | base64 -w 0)"
          echo "NGINX_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Deploy monitoring stack to the VM
        shell: bash
        run: |
          az vm run-command invoke \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --command-id RunShellScript \
            --scripts @.github/scripts/deploy-nginx.sh \
            --parameters "NGINX_ARCHIVE=$NGINX_ARCHIVE" \
            --output json > run-command-result.json

          jq -r '.value[] | select(.message != "") | .message' run-command-result.json
          jq -e 'all(.value[]; .code | endswith("/succeeded"))' run-command-result.json

      - name: Verify public endpoint
        shell: bash
        run: |
          vm_ip="$(az vm show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --show-details \
            --query publicIps \
            --output tsv)"
          test -n "$vm_ip"
          curl --fail --show-error --retry 6 --retry-delay 10 \
            "http://${vm_ip}/healthz"
