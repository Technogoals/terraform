name: Deploy Azure VM with Terraform

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - name: Initialize providers without backend
        run: terraform init -backend=false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate configuration
        run: terraform validate

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: azure-production
    concurrency:
      group: terraform-azure-vm
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: c81c9b39-80e2-4a59-ad14-06d824499230
      ARM_TENANT_ID: 8b9be59e-0342-4505-8432-2777ffdee5f4
      ARM_SUBSCRIPTION_ID: cde0b09e-60fb-40de-85fa-f9af8b6dd549
      ARM_USE_AZUREAD: "true"
      ARM_USE_OIDC: "true"
      SSH_PUBLIC_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMLcczJqh4bKeUgWKwxXCRr8LlWbT/RqVj1a4s1fFrx0 siva@Sivas-MacBook-Pro.local
      TF_IN_AUTOMATION: "true"
      TF_VAR_subscription_id: cde0b09e-60fb-40de-85fa-f9af8b6dd549
      TF_VAR_location: swedencentral
      TF_VAR_vm_size: Standard_D2als_v6
      TF_VAR_allowed_ssh_cidr: 2.121.53.164/32
      TF_VAR_ssh_public_key_path: ./deployment_key.pub

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - name: Write SSH public key
        run: printf '%s\n' "$SSH_PUBLIC_KEY" > deployment_key.pub

      - name: Initialize Azure Storage backend
        run: >-
          terraform init -reconfigure
          -backend-config="resource_group_name=SaiTarunRG"
          -backend-config="storage_account_name=saitaruntfcde0b09e"
          -backend-config="container_name=tfstate"
          -backend-config="key=azure-vm/terraform.tfstate"
          -backend-config="client_id=${ARM_CLIENT_ID}"
          -backend-config="tenant_id=${ARM_TENANT_ID}"
          -backend-config="subscription_id=${ARM_SUBSCRIPTION_ID}"
          -backend-config="use_azuread_auth=true"
          -backend-config="use_oidc=true"
          -backend-config="use_cli=false"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate configuration
        run: terraform validate

      - name: Create saved plan
        shell: bash
        run: |
          if [[ "${{ inputs.operation }}" == "destroy" ]]; then
            terraform plan -destroy -input=false -lock-timeout=5m -out=tfplan
          else
            terraform plan -input=false -lock-timeout=5m -out=tfplan
          fi

      - name: Apply saved plan
        if: inputs.operation == 'apply' || inputs.operation == 'destroy'
        run: terraform apply -input=false -lock-timeout=5m -auto-approve tfplan

  deploy_monitoring:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
    needs: deploy
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-nginx.yml
