server {
    listen 80;
    listen [::]:80;
    server_name aiinc.uk www.aiinc.uk;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        default_type text/html;
        return 200 '<!doctype html><html><head><title>aiinc.uk</title></head><body><h1>aiinc.uk</h1><p>Nginx is running in Docker.</p></body></html>';
    }
}
